<!DOCTYPE html>
<!--
  Week 3 (M4) — test page for the prediction API.

  Served by FastAPI at / so the page and the API share an origin. That avoids
  CORS setup, and it means the container needs nothing extra to serve this.

  No framework and no build step. One file, plain CSS and JavaScript.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Sentiment Classifier</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --ink: #1a1d21;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --neg: #dc2626;
    --neg-bg: #fef2f2;
    --pos: #059669;
    --pos-bg: #ecfdf5;
    --warn: #b45309;
    --warn-bg: #fffbeb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex: none;
  }
  .dot.up { background: var(--pos); }
  .dot.down { background: var(--neg); }
  code { font: 12.5px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 16px;
  }
  label.field { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip {
    font-size: 12.5px; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.bad { border-style: dashed; color: var(--muted); }

  textarea {
    width: 100%; min-height: 96px; resize: vertical; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    font: inherit; color: inherit; background: var(--bg);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }

  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .count { font-size: 12.5px; color: var(--muted); }
  .count.over { color: var(--neg); font-weight: 600; }

  button.go {
    padding: 9px 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button.go:hover { background: #1d4ed8; }
  button.go:disabled { background: #9ca3af; cursor: default; }

  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 6px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
  }
  .badge.negative { background: var(--neg-bg); color: var(--neg); }
  .badge.positive { background: var(--pos-bg); color: var(--pos); }

  .bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .bar span { display: block; height: 100%; border-radius: 999px; transition: width .25s; }
  .bar span.negative { background: var(--neg); }
  .bar span.positive { background: var(--pos); }

  .meta { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .cleaned {
    margin-top: 6px; padding: 9px 11px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-word;
  }
  .note {
    margin-top: 12px; padding: 9px 11px; border-radius: 6px; font-size: 13px;
    background: var(--warn-bg); color: var(--warn); border: 1px solid #fde68a;
  }
  .err {
    background: var(--neg-bg); border-color: #fecaca; color: var(--neg);
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.t { color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Review Sentiment Classifier</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">checking API…</span>
    </div>
  </header>

  <div class="card">
    <label class="field" for="text">Review text</label>
    <div class="chips" id="chips"></div>
    <textarea id="text" placeholder="Paste a customer review or support ticket…"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 5000</span>
      <button class="go" id="go">Analyse review</button>
    </div>
  </div>

  <div class="card hide" id="result"></div>

  <div class="card hide" id="historyCard">
    <label class="field">This session</label>
    <table>
      <thead><tr><th>Review</th><th>Label</th><th>Confidence</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </div>

</div>

<script>
const EXAMPLES = [
  { label: "clearly negative", text: "arrived stale and tasted awful, complete waste of money" },
  { label: "clearly positive", text: "absolutely delicious, will buy again" },
  { label: "negation test",    text: "not good at all, very disappointed" },
  { label: "mixed / unsure",   text: "the packaging was damaged but the coffee is fine" },
  { label: "invalid input",    text: "!!!???", bad: true },
];

const $ = id => document.getElementById(id);
const text = $("text"), go = $("go"), count = $("count"), result = $("result");

// Health check, so the loaded model name is visible on screen.
fetch("/health").then(r => r.json()).then(d => {
  $("dot").className = "dot up";
  $("statusText").innerHTML = `API ready — serving <code>${d.model}</code>`;
}).catch(() => {
  $("dot").className = "dot down";
  $("statusText").textContent = "API unreachable";
});

EXAMPLES.forEach(ex => {
  const b = document.createElement("button");
  b.className = "chip" + (ex.bad ? " bad" : "");
  b.textContent = ex.label;
  b.onclick = () => { text.value = ex.text; update(); text.focus(); };
  $("chips").appendChild(b);
});

function update() {
  const n = text.value.length;
  count.textContent = `${n} / 5000`;
  count.className = "count" + (n > 5000 ? " over" : "");
}
text.addEventListener("input", update);
text.addEventListener("keydown", e => {
  // Enter sends; Shift+Enter adds a newline.
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
go.onclick = submit;

function show(html, isError) {
  result.className = "card" + (isError ? " err" : "");
  result.innerHTML = html;
}

async function submit() {
  const value = text.value;
  if (!value.trim()) { show("<b>Nothing to analyse.</b> Type a review first.", true); return; }

  go.disabled = true;
  go.textContent = "Analysing…";
  const started = performance.now();

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: value }),
    });
    const roundTrip = Math.round(performance.now() - started);
    const data = await res.json();

    if (!res.ok) {
      // FastAPI returns 422 with a detail array. Show the real message,
      // because the validation rules are a graded part of the project.
      const msg = Array.isArray(data.detail)
        ? data.detail.map(d => d.msg).join("; ")
        : JSON.stringify(data.detail);
      show(`<b>Rejected — HTTP ${res.status}</b><div class="meta">${msg}</div>`, true);
      return;
    }

    const pct = (data.confidence * 100).toFixed(2);
    let html = `
      <span class="badge ${data.label}">${data.label.toUpperCase()}</span>
      <div class="meta"><b>${pct}%</b> confident in this label</div>
      <div class="bar"><span class="${data.label}" style="width:${pct}%"></span></div>
      <div class="meta">What the model actually read, after cleaning:
        <div class="cleaned">${escape_(data.cleaned_text)}</div>
      </div>
      <div class="meta">Round trip <b>${roundTrip} ms</b></div>`;

    if (data.confidence < 0.8) {
      html += `<div class="note">Confidence is below 0.8. The monitoring rule counts
               these, and retraining triggers when they pass 25% of the last 100
               predictions.</div>`;
    }
    show(html, false);
    addHistory(value, data);
  } catch (err) {
    show(`<b>Request failed.</b><div class="meta">${err.message}</div>`, true);
  } finally {
    go.disabled = false;
    go.textContent = "Analyse review";
  }
}

function escape_(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function addHistory(input, data) {
  $("historyCard").classList.remove("hide");
  const tr = document.createElement("tr");
  const short = input.length > 52 ? input.slice(0, 52) + "…" : input;
  tr.innerHTML = `<td class="t">${escape_(short)}</td>
                  <td><span class="badge ${data.label}">${data.label}</span></td>
                  <td>${(data.confidence * 100).toFixed(2)}%</td>`;
  $("history").prepend(tr);
}

update();
</script>
</body>
</html>
